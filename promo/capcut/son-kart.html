<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>getirtrend – Kapanış Kartı</title>

<body data-music="pop" data-dots="off">
<div id="stage">

    <div data-in="0.1" data-anim="pop" data-d="0.7"><span class="gt" style="font-size:136px"><img src="../assets/logo-mark.svg"><span>getir<b>trend</b></span></span></div>

    <div style="display:flex;gap:22px" data-in="0.8" data-anim="up">

    <div class="gap"></div>
    <div class="urlb" data-in="1.2" data-anim="pop">getirtrend.com/restoran-ol</div>

</div>
<script>window.DEFAULT_DURS = [5.2];</script>
<script src="../engine.js"></script>
