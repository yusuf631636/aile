<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>getirtrend – Harflerin İçinde</title>
<link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="assets/brand.css">
<style>
  /* Giant words used as windows onto real food photos (background-clip:text), cut on the beat. */
  #stage { background: #F6EEE4; color: #221D19; }
  .scene { padding: 0; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .kick { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: 62px; letter-spacing: -1.5px; color: #221D19; margin-bottom: -10px; }
  .mask { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 330px; line-height: .9; letter-spacing: -14px; white-space: nowrap;
    color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 160% auto; background-position: 50% 50%; padding: 0 20px 30px; }
  .bar { position: absolute; left: 0; width: 100%; height: 0; background: #D7351F; z-index: 5; }
  .num { position: absolute; top: 90px; right: 80px; font-family: 'JetBrains Mono'; font-size: 36px; color: #221D19; opacity: .6; }
  .tag { position: absolute; top: 90px; left: 80px; }
  .thumb { position: absolute; width: 220px; height: 220px; border-radius: 30px; object-fit: cover; border: 8px solid #fff; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
  #end { background: #221D19; color: #fff; }
  #end .mask { font-size: 200px; letter-spacing: -9px; }
</style></head>
<body data-music="house" data-dots="off">
<div id="stage">
  <div class="scene" id="w" data-static="1" data-dur="11.8">
    <div class="tag"><span class="gt" style="font-size:52px"><img src="assets/logo-mark.svg"><span>getir<b>trend</b></span></span></div>
    <div class="num" id="num">01 / 05</div>
    <div id="wrap"><div class="kick" id="kick"></div><div class="mask" id="word"></div></div>
    <img class="thumb" id="th1" style="left:70px;bottom:260px"><img class="thumb" id="th2" style="right:70px;bottom:200px">
    <div class="bar" id="bar"></div>
  </div>
  <div class="scene" id="end" data-static="1" data-dur="6.2" data-sfx="whoosh:0;success:0.8">
    <div class="mask" id="endw" style="background-image:url(assets/lahmacun2.jpg);-webkit-text-stroke:3px rgba(255,255,255,.55)" data-in="0.1" data-anim="pop" data-d="0.7">getirtrend</div>
    <div style="height:50px"></div>
    <div data-in="0.6" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:84px;letter-spacing:-3px;line-height:1.05;text-align:center">Restoranını<br><span style="color:#FF8A70">ücretsiz ekle</span></div>
    <div style="height:30px"></div>
    <div data-in="1.0" style="font-family:'Plus Jakarta Sans';font-weight:600;font-size:40px;opacity:.8">İlk etapta komisyon yok · Aylık ücret yok</div>
    <div style="height:70px"></div>
    <div data-in="1.4" data-anim="pop" id="cta" style="background:#D7351F;color:#fff;font:800 58px 'Plus Jakarta Sans';padding:32px 70px;border-radius:999px">getirtrend.com/restoran-ol</div>
  </div>
</div>
<script src="engine.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const B = 60 / 122, LEN = 4 * B; // one word per bar of the house track
  const W = [
    ['Mahallenin', 'LEZZETİ', 'lahmacun2', 'pide', 'baklava'],
    ['telefonuna', 'SİPARİŞ', 'pide2', 'durum', 'kebap'],
    ['fırından', 'SICAK', 'lahmacun3', 'adana', 'pizza'],
    ['kapıya', 'TESLİM', 'durum', 'lahmacun', 'cigkofte'],
    ['kasana', 'KAZANÇ', 'kebap', 'izgara', 'pide'],
  ];
  const sc = $('w');
  sc.dataset.dur = (W.length * LEN + 2 * B).toFixed(2);
  sc.dataset.sfx = W.map((_, i) => `whoosh:${(i * LEN).toFixed(2)}`).join(';');
  window.DEFAULT_DURS = [+sc.dataset.dur, 6.2];
  let cur = -1;
  HOOKS.w = (lt) => {
    const i = Math.min(W.length - 1, Math.floor(lt / LEN)), k = lt - i * LEN;
    const [kk, word, img, t1, t2] = W[i];
    if (i !== cur) {
      cur = i; $('kick').textContent = kk; const w = $('word'); w.textContent = word;
      w.style.backgroundImage = `url(assets/${img}.jpg)`; w.style.transform = 'none';
      const fit = Math.min(1, 1000 / w.scrollWidth); w.dataset.fit = fit;
      $('th1').src = `assets/${t1}.jpg`; $('th2').src = `assets/${t2}.jpg`;
      $('num').textContent = `0${i + 1} / 0${W.length}`;
    }
    const w = $('word'), fit = +w.dataset.fit;
    const inK = easeOut(clamp(k / 0.35)), beat = (lt % B) / B;
    w.style.transform = `translateY(${(1 - inK) * 160}px) scale(${fit * (1 + 0.03 * Math.pow(1 - beat, 3))})`;
    w.style.letterSpacing = `${-14 + (1 - inK) * 40}px`;
    w.style.backgroundPosition = `${30 + 40 * (k / LEN)}% ${50 + 10 * Math.sin(k)}%`;
    w.style.opacity = clamp(k / 0.12);
    $('kick').style.opacity = easeOut(clamp((k - 0.15) / 0.3)); $('kick').style.transform = `translateY(${(1 - easeOut(clamp((k - 0.15) / 0.3))) * -40}px)`;
    // thumbnails pop in on beats 2 and 3 of each bar
    [['th1', B, -8], ['th2', 2 * B, 7]].forEach(([id, a, r]) => { const p = clamp((k - a) / 0.3), o = clamp((LEN - k) / 0.2);
      $(id).style.opacity = Math.min(p, o); $(id).style.transform = `rotate(${r}deg) scale(${0.5 + 0.5 * back(p)})`; });
    // red wipe bar between words
    const wipe = clamp((k - (LEN - 0.22)) / 0.22) + (i > 0 ? clamp(1 - k / 0.22) : 0);
    const bar = $('bar'); bar.style.height = (wipe * 1920) + 'px'; bar.style.top = (k > LEN / 2 ? 1920 - wipe * 1920 : 0) + 'px';
  };
  HOOKS.end = (lt) => {
    $('endw').style.backgroundPosition = `${30 + 8 * lt}% 50%`;
    if (lt > 2.2) $('cta').style.transform = `scale(${1 + 0.04 * Math.sin((lt - 2.2) * 7)})`;
  };
</script>
</body>
</html>
