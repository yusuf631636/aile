<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>getirtrend – Herkes Kazanır (C)</title>
<link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="assets/brand.css"><link rel="stylesheet" href="mg.css">
<style>
  .ph2 { width: 520px; height: 520px; border-radius: 60px; object-fit: cover; border: 14px solid #fff; box-shadow: 0 40px 90px rgba(0,0,0,.45); position: relative; }
  .price { position: absolute; right: -40px; top: -40px; background: #fff; color: var(--nv); font-weight: 800; font-size: 60px; padding: 20px 34px; border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,.3); letter-spacing: -2px; }
  .price s { color: #e0453a; font-size: 44px; margin-right: 12px; }
  .two { display: flex; gap: 30px; }
  .two .ben { width: 455px; flex-direction: column; text-align: center; font-size: 54px; padding: 40px 26px; }
  .btn2 { font-weight: 800; font-size: 50px; padding: 32px 0; border-radius: 999px; width: 455px; text-align: center; letter-spacing: -1px; }
</style></head>
<body data-music="pop" data-dots="off">
<div id="stage">
  <div class="scene" id="k1" data-static="1" data-dur="3.2" data-sfx="whoosh:0;pop:0.9">
    <div style="position:relative" id="pw"><img class="ph2" src="assets/lahmacun2.jpg"><div class="price" id="pr"><s>?</s>₺</div></div>
    <div style="height:70px"></div>
    <div class="hk" id="q" style="font-size:96px">Aynı lahmacun,<br><em>neden daha pahalı?</em></div>
  </div>
  <div class="scene" id="k2" data-static="1" data-dur="7.0" data-sfx="whoosh:0;pop:1.2;pop:3.2;success:5.0">
    <div class="bgfx" style="background:linear-gradient(160deg,#fff,#FFF1E8)"></div>
    <div class="t2" style="color:var(--nv);position:relative" id="k2t">Çünkü <em>komisyon</em> var.<br><span class="gt" style="font-size:80px"><img src="assets/logo-mark.svg"><span>getir<b style="color:var(--or)">trend</b></span></span>'de yok*</div>
    <div style="height:56px"></div>
    <div class="two" style="position:relative">
      <div class="ben" id="r"><span data-ic="store"></span><div>Restoran<br><span style="color:var(--or)">kazancın tamamı</span><small>Komisyon yok, aracı yok</small></div></div>
      <div class="ben" id="m"><span data-ic="smile"></span><div>Müşteri<br><span style="color:var(--or)">adil fiyat</span><small>Kapıda nakit ya da kart</small></div></div>
    </div>
    <div style="height:50px"></div>
    <div class="t2" id="win" style="color:var(--nv);position:relative;font-size:84px">Herkes <em>kazanır.</em></div>
    <div class="foot" style="color:var(--nv)">*İlk etapta komisyon alınmaz.</div>
  </div>
  <div class="scene" id="k3" data-static="1" data-dur="5.0" data-sfx="whoosh:0;success:0.5">
    <div class="bgfx" style="background:radial-gradient(80% 60% at 50% 40%, var(--nv2), var(--nv))"></div>
    <div class="brandw" id="bw" style="position:relative;font-size:160px">getir<span>trend</span></div>
    <div style="height:90px"></div>
    <div class="two" style="flex-direction:column;align-items:center;gap:30px;position:relative">
      <div class="btn2" id="b1" style="background:var(--or);color:#fff;width:820px">Restoranını Ücretsiz Ekle →</div>
      <div class="btn2" id="b2" style="background:#fff;color:var(--nv);width:820px">Hemen Sipariş Ver →</div>
    </div>
    <div style="height:50px"></div>
    <div class="url2" id="u" style="position:relative">getirtrend.com</div>
  </div>
</div>
<script src="engine.js"></script>
<script src="assets/icons.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const spring = k => k <= 0 ? 0 : 1 - Math.exp(-6 * k) * Math.cos(11 * k);
  const eio = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  window.DEFAULT_DURS = [3.2, 7.0, 5.0];
  HOOKS.k1 = (lt) => {
    const k = clamp(lt / 0.6); $('pw').style.transform = `scale(${spring(k)}) rotate(${(1 - spring(k)) * -10}deg)`;
    const p = clamp((lt - 0.8) / 0.5); $('pr').style.transform = `scale(${spring(p)}) rotate(8deg)`; $('pr').style.opacity = clamp(p * 3);
    const q = clamp((lt - 1.1) / 0.5); $('q').style.opacity = eio(q); $('q').style.transform = `translateY(${(1 - eio(q)) * 50}px)`;
  };
  HOOKS.k2 = (lt) => {
    $('k2t').style.opacity = eio(lt / 0.5);
    [['r', 1.1, -1], ['m', 3.1, 1]].forEach(([id, a, d]) => { const k = clamp((lt - a) / 0.6);
      $(id).style.opacity = clamp(k * 3); $(id).style.transform = `translateX(${(1 - spring(k)) * 600 * d}px)`; });
    const w = clamp((lt - 4.9) / 0.6); $('win').style.opacity = clamp(w * 3); $('win').style.transform = `scale(${spring(w)})`;
  };
  HOOKS.k3 = (lt) => {
    const k = clamp(lt / 0.6); $('bw').style.transform = `scale(${spring(k)})`;
    [['b1', 0.6], ['b2', 0.9]].forEach(([id, a]) => { const kk = clamp((lt - a) / 0.6); $(id).style.opacity = clamp(kk * 3); $(id).style.transform = `scale(${spring(kk)})`; });
    const beat = lt > 1.6 ? (lt - 1.6) % 0.9 / 0.9 : 0, b = $('b1');
    if (lt > 1.6) { b.style.transform = `scale(${1 + 0.05 * Math.sin(beat * Math.PI)})`; b.style.boxShadow = `0 0 0 ${beat * 40}px rgba(255,107,26,${0.5 * (1 - beat)})`; }
    $('u').style.opacity = eio((lt - 1.3) / 0.5);
  };
</script>
</body>
</html>
