<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>GetirTrend – Hızlı Reklam</title><link rel="stylesheet" href="engine.css">
<style>
  .stop { font-weight: 900; font-size: 330px; letter-spacing: -14px; line-height: .9; color: var(--accent); text-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 150px; letter-spacing: -6px; line-height: 1; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
</style></head>
<body>
<div id="stage">
  <div class="blob" style="width:760px;height:760px;background:#1fbf86"></div>
  <div class="blob" style="width:620px;height:620px;background:#ff6a3d"></div>
  <div class="vignette"></div>

  <div class="scene" id="e1" data-voice="Dur! Restoranın varsa, bu videoyu sonuna kadar izle." data-sfx="whoosh:0;pop:0.15">
    <div class="stop" data-in="0.05" data-anim="pop" data-d="0.4" id="dur">DUR!</div>
    <div style="font-size:200px;line-height:1.1" data-in="0.25" data-anim="pop" id="hand">✋</div>
    <div class="gap"></div>
    <div class="h2" data-in="0.9">Restoranın varsa<br><span class="hl">bunu izle</span> 👇</div>
  </div>

  <div class="scene" id="e2" data-voice="Daha çok sipariş. Daha çok müşteri. Daha çok kazanç." data-min="4" data-sfx="whoosh:0.35;whoosh:1.55;whoosh:2.75">
    <div class="kicker" data-in="0.05" style="position:absolute;top:520px;left:0;right:0">GetirTrend ile</div>
    <div style="position:relative;width:1080px;height:600px">
      <div class="word" id="w1">Daha çok<br><span class="hl">sipariş</span></div>
      <div class="word" id="w2">Daha çok<br><span class="hl">müşteri</span></div>
      <div class="word" id="w3">Daha çok<br><span class="hl">kazanç</span></div>
    </div>
  </div>

  <div class="scene" id="e3" data-voice="Siparişler telefonuna yağsın, doğrudan kasana düşsün." data-min="4.4"
       data-sfx="ding:0.4;ding:1.0;ding:1.5;ding:1.95;ding:2.35;ding:2.7;cash:3.3">
    <div class="phone" data-in="0" data-anim="rise" data-d="0.6"><div class="notch"></div><div class="screen" style="background:linear-gradient(#0f5c45,#08352a)">
      <div style="color:#fff;text-align:center;padding-top:110px;font-weight:300;font-size:120px;letter-spacing:-4px">20:15</div>
      <div id="stack5" style="position:absolute;left:24px;right:24px;top:300px;bottom:0"></div>
    </div></div>
    <div id="counter" style="position:absolute;top:120px;right:70px;background:#ff3d3d;color:#fff;font-weight:900;font-size:64px;
      min-width:120px;height:120px;border-radius:60px;display:flex;align-items:center;justify-content:center;padding:0 30px;box-shadow:0 10px 40px rgba(255,61,61,.5)">0</div>
  </div>

  <div class="scene" id="e4" data-voice="Restoranını bugün, ücretsiz ekle. Getir Trend nokta kom, bölü, restoran ol." data-sfx="pop:0.1">
    <div class="logo" data-in="0.1" data-anim="pop" data-d="0.7">Getir<span>Trend</span></div>
    <div class="gap"></div>
    <div class="h1" data-in="0.45">Bugün<br><span class="hl">ücretsiz</span> ekle</div>
    <div class="gap-l"></div>
    <div class="url" data-in="1.4" data-anim="pop">getirtrend.com/restoran-ol</div>
    <div class="gap"></div>
    <div class="btn" data-in="2.0" data-anim="pop" id="cta5">Hemen Başla →</div>
    <div class="gap"></div>
    <div class="p" data-in="2.8">Bağlantı açıklamada 🔗</div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="progress"></div>
</div>
<script>window.DEFAULT_DURS = [3.6, 4, 4.4, 6.5];</script>
<script src="engine.js"></script>
<script>
  const $ = id => document.getElementById(id);
  HOOKS.e1 = (lt) => {
    const sh = lt < 0.7 ? Math.sin(lt * 80) * 10 * (1 - lt / 0.7) : 0;
    $('dur').style.translate = `${sh}px 0`;
    $('hand').style.rotate = `${Math.sin(lt * 5) * 8}deg`;
  };
  HOOKS.e2 = (lt) => {
    ['w1', 'w2', 'w3'].forEach((id, i) => {
      const a = 0.35 + i * 1.2, k = clamp((lt - a) / 0.3), out = i < 2 ? clamp((lt - a - 1.0) / 0.2) : 0;
      const el = $(id);
      el.style.top = '120px';
      el.style.opacity = Math.min(k, 1 - out);
      el.style.transform = `scale(${(0.4 + 0.6 * back(k)) * (1 + 0.5 * out)}) rotate(${(1 - k) * (i % 2 ? 8 : -8)}deg)`;
    });
  };
  const orders = [['Yeni sipariş · ₺ 360', '2× Lahmacun, 1× Ayran'], ['Yeni sipariş · ₺ 420', '2× Kıymalı Pide'],
                  ['Yeni sipariş · ₺ 270', 'Tavuk Döner, Sütlaç'], ['Yeni sipariş · ₺ 515', 'Karışık Pizza, Kola'],
                  ['Yeni sipariş · ₺ 190', 'Mercimek Çorbası, Pilav'], ['Yeni sipariş · ₺ 640', '4× Adana Dürüm']];
  const times = [0.4, 1.0, 1.5, 1.95, 2.35, 2.7];
  const stack = $('stack5');
  orders.forEach(([b, s]) => stack.insertAdjacentHTML('beforeend',
    `<div class="notif" style="left:0;right:0;top:0"><i>🛵</i><div><b>${b}</b><span>${s}</span></div></div>`));
  HOOKS.e3 = (lt) => {
    let arrived = 0;
    times.forEach((a, i) => { arrived += clamp((lt - a) / 0.3); });
    [...stack.children].forEach((el, i) => {
      const k = easeOut((lt - times[i]) / 0.3);
      el.style.opacity = k; el.style.zIndex = 10 + i;
      el.style.top = (Math.max(0, arrived - 1 - i) * 150 + (1 - k) * -100) + 'px';
    });
    const n = times.filter(a => lt >= a).length, c = $('counter');
    c.textContent = n;
    const lastHit = Math.max(...times.filter(a => lt >= a), -9);
    c.style.transform = `scale(${n ? 1 + 0.3 * clamp(1 - (lt - lastHit) / 0.25) : 0})`;
    $('flash').style.opacity = 0;
  };
  HOOKS.e4 = (lt) => {
    $('flash').style.opacity = 0.6 * clamp(1 - lt / 0.25);
    if (lt > 2.6) $('cta5').style.transform = `scale(${1 + 0.04 * Math.sin((lt - 2.6) * 7)})`;
  };
</script>
</body>
</html>
