<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>getirtrend – Premium Mağaza</title>
<link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="assets/brand.css"><link rel="stylesheet" href="pro.css">
<style>
  /* Studio product film: real store products on a seamless backdrop (white image bg multiplied away). */
  #stage { background: linear-gradient(#F6F4F1, #ECE8E2); }
  .prod { position: absolute; left: 170px; top: 450px; width: 740px; height: 760px; background: #fff; border-radius: 46px; padding: 40px; box-shadow: 0 50px 90px rgba(29,26,23,.16); will-change: transform; }
  .prod img { width: 100%; height: 100%; object-fit: contain; }
  .shadow { display: none; position: absolute; left: 290px; top: 1215px; width: 500px; height: 70px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.28), transparent 70%); }
  .word { position: absolute; left: 70px; right: 70px; top: 230px;  font: 800 150px/0.95 'Plus Jakarta Sans'; letter-spacing: -7px; color: #1d1a17; text-align: left; }
  .word i { font-style: normal; color: #D7351F; }
  .pname { position: absolute; left: 70px; top: 1340px; text-align: left; }
  .pname small { display: block; font: 700 28px 'Inter'; letter-spacing: 4px; color: #D7351F; text-transform: uppercase; }
  .pname b { display: block; font: 300 66px 'Inter'; letter-spacing: -2px; color: #1d1a17; margin-top: 6px; }
  .facts { position: absolute; left: 70px; right: 70px; top: 1520px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 2px solid rgba(29,26,23,.18); }
  .facts div { padding: 22px 0; border-bottom: 2px solid rgba(29,26,23,.18); font: 600 34px 'Inter'; color: #1d1a17; text-align: left; }
  .facts div b { display: block; font: 800 50px 'Plus Jakarta Sans'; letter-spacing: -1.5px; }
</style></head>
<body data-music="corporate" data-dots="off">
<div id="stage">
  <div class="scene" id="m" data-static="1" data-dur="16.8">
    <div class="topbar"><span class="gt" style="font-size:44px"><img src="assets/logo-mark.svg"><span>getir<b>trend</b></span></span><span class="idx">PAZARYERİ</span></div>
    <div class="rule" id="rl"></div>
    <div class="word" id="word"></div>
    <div class="word" id="fw" style="opacity:0;font-size:120px;letter-spacing:-5px">Sen de<br><i>sat.</i></div>
    <div class="shadow" id="sh"></div>
    <div id="prods"></div>
    <div class="pname" id="pn"><small id="pnc"></small><b id="pnn"></b></div>
    <div class="facts" id="facts">
      <div id="fa1"><b>0 TL</b>Başvuru ve aylık ücret</div><div id="fa2" style="padding-left:30px"><b>%10</b>Yalnız satışta komisyon</div>
      <div id="fa3"><b>1 gün</b>İçinde başvuru yanıtı</div><div id="fa4" style="padding-left:30px"><b>IBAN</b>Şeffaf hakediş</div>
    </div>
  </div>
  <div class="scene" id="end" data-static="1" data-dur="5.0" data-sfx="success:0.4">
    <div id="lock" style="position:absolute;top:640px;left:0;right:0;text-align:center"><span class="gt" style="font-size:150px"><img src="assets/logo-mark.svg"><span>getir<b>trend</b></span></span></div>
    <div class="rule" style="top:880px;left:240px;right:240px" id="er"></div>
    <div id="sub" style="position:absolute;top:930px;left:0;right:0;text-align:center;font:300 60px 'Inter';letter-spacing:-1.5px">Mağazanı aç. <b style="font-family:'Plus Jakarta Sans';font-weight:800">Satışa başla.</b></div>
    <div id="pill" style="position:absolute;top:1120px;left:0;right:0;display:flex;justify-content:center"><div class="pillo">getirtrend.com/satici-ol</div></div>
    <div id="sm" style="position:absolute;top:1290px;left:0;right:0;text-align:center;font:500 34px 'Inter';opacity:.6">Kargo senin kontrolünde · Siparişler telefonunda</div>
  </div>
</div>
<script src="engine.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const eio = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  // [product image, category, product, big word]
  const P = [
    ['p1', 'Ödeme sistemleri', 'POS Terminali', 'Listele.'],
    ['p4', 'Çiçek & hediye', 'Gül Buketi', 'Sat.'],
    ['p2', 'Barkod & yazıcı', 'Fiş Yazıcı', 'Kargola.'],
    ['p10', 'Ev & yaşam', 'Elektrikli Kettle', '<i>Kazan.</i>'],
  ];
  const L = 3.0;
  $('prods').innerHTML = P.map((p, i) => `<div class="prod" id="pr${i}"><img src="assets/prod/${p[0]}.jpg"></div>`).join('');
  const sc = $('m'); sc.dataset.sfx = P.map((_, i) => `whoosh:${(i * L).toFixed(2)}`).join(';') + ';pop:12.6;pop:12.9;pop:13.2;pop:13.5';
  window.DEFAULT_DURS = [16.8, 5.0];
  let cur = -1;
  HOOKS.m = (lt) => {
    $('rl').style.transform = `scaleX(${eio(lt / 0.8)})`;
    const i = Math.min(P.length - 1, Math.floor(lt / L)), k = lt - i * L;
    if (i !== cur) { cur = i; $('word').innerHTML = P[i][3]; $('pnc').textContent = P[i][1]; $('pnn').textContent = P[i][2]; }
    const factsOn = lt > 12.3;
    P.forEach((_, j) => {
      const el = $('pr' + j), kk = lt - j * L;
      if (factsOn) {  // final scene: all four products line up as a small shelf
        const t = eio((lt - 12.3 - j * 0.08) / 0.7);
        el.style.opacity = t; el.style.transform = `translate(${-170 + 70 + j * 240 - 370 + 370 * (1 - t) * 0}px, ${-120}px) scale(.28)`;
        el.style.transformOrigin = '0 0'; el.style.left = (70 + j * 240) + 'px'; el.style.top = '600px'; el.style.transform = `scale(${0.28 * (0.8 + 0.2 * t)}) translateY(${(1 - t) * 200}px)`;
        return;
      }
      el.style.transformOrigin = '50% 50%'; el.style.left = '170px'; el.style.top = '450px';
      if (kk < -0.1 || (kk > L + 0.5 && j < P.length - 1)) { el.style.opacity = 0; return; }
      const inn = eio(kk / 0.7), out = j < P.length - 1 ? eio((kk - L + 0.2) / 0.5) : 0;
      const shrink = factsOn ? eio((lt - 12.3) / 0.8) : 0;
      el.style.opacity = Math.min(inn, 1 - out);
      el.style.transform = `translateX(${(1 - inn) * 500 - out * 500}px) rotate(${(1 - inn) * 8 - out * 8 + Math.sin(lt * 0.9) * 1.5}deg) translateY(${-shrink * 560}px) scale(${(0.94 + 0.06 * inn) * (1 - 0.45 * shrink)})`;
    });
    $('sh').style.opacity = factsOn ? 0 : 0.9; $('sh').style.transform = `scaleX(${0.85 + 0.15 * Math.sin(lt * 0.9)})`;
    const w = eio((k - 0.1) / 0.5), wo = i < P.length - 1 ? 1 - eio((k - L + 0.25) / 0.25) : 1;
    $('word').style.opacity = Math.min(w, wo) * (factsOn ? 1 - eio((lt - 12.3) / 0.4) : 1);
    $('word').style.clipPath = `inset(0 ${(1 - w) * 100}% 0 0)`;
    const pn = eio((k - 0.4) / 0.5); $('pn').style.opacity = Math.min(pn, wo) * (factsOn ? 1 - eio((lt - 12.3) / 0.4) : 1); $('pn').style.transform = `translateY(${(1 - pn) * 30}px)`;
    ['fa1', 'fa2', 'fa3', 'fa4'].forEach((id, j) => { const t = eio((lt - 12.6 - j * 0.3) / 0.5); $(id).style.opacity = t; $(id).style.transform = `translateY(${(1 - t) * 30}px)`; });
    const fw = eio((lt - 12.4) / 0.6); $('fw').style.opacity = fw; $('fw').style.clipPath = `inset(0 ${(1 - fw) * 100}% 0 0)`;
    $('facts').style.top = (1520 - 620 * eio((lt - 12.3) / 0.8)) + 'px';
  };
  HOOKS.end = (lt) => {
    const a = eio(lt / 0.8); $('lock').style.opacity = a; $('lock').style.transform = `translateY(${(1 - a) * 40}px) scale(${0.96 + 0.04 * a})`;
    $('er').style.transform = `scaleX(${eio((lt - 0.4) / 0.8)})`;
    const b = eio((lt - 0.6) / 0.7); $('sub').style.opacity = b; $('sub').style.transform = `translateY(${(1 - b) * 30}px)`;
    const c = eio((lt - 1.0) / 0.7); $('pill').style.opacity = c; $('pill').style.transform = `translateY(${(1 - c) * 30}px)`;
    $('sm').style.opacity = 0.6 * eio((lt - 1.3) / 0.7);
  };
</script>
</body>
</html>
