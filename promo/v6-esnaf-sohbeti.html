<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>getirtrend – Esnaf Sohbeti</title><link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="assets/brand.css"><link rel="stylesheet" href="chat.css">
<style>
  #out { background: var(--gt-blush); color: var(--gt-ink); }
  #out .photos { display: flex; gap: 22px; }
  #out .photos img { width: 300px; height: 300px; border-radius: 34px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,.25); border: 8px solid #fff; }
</style></head>
<body data-music="chill" data-dots="off">
<div id="stage">
  <div class="scene" id="chat" data-static="1"></div>
  <div class="scene" id="out" data-dur="5.6" data-sfx="whoosh:0;success:0.5">
    <div data-in="0.1" data-anim="pop" data-d="0.7"><span class="gt" style="font-size:128px"><img src="assets/logo-mark.svg"><span>getir<b>trend</b></span></span></div>
    <div class="gap"></div>
    <div class="h2 jak" data-in="0.5">Sen de hemen<br><span style="color:var(--gt-red)">restoranını ekle</span></div>
    <div class="gap"></div>
    <div class="photos" data-in="0.9" data-anim="up">
      <img src="assets/pide.jpg" style="transform:rotate(-4deg)"><img src="assets/durum.jpg" style="transform:translateY(-24px)"><img src="assets/kebap.jpg" style="transform:rotate(4deg)">
    </div>
    <div class="gap"></div>
    <div class="url jak" data-in="1.3" data-anim="pop" style="background:var(--gt-ink);color:#fff">getirtrend.com/restoran-ol</div>
    <div class="gap-s"></div>
    <div class="btn jak" data-in="1.8" data-anim="pop" id="cta" style="background:var(--gt-red);color:#fff;box-shadow:0 24px 60px rgba(215,53,31,.4)">Ücretsiz Başvur →</div>
  </div>
</div>
<script src="engine.js"></script>
<script src="assets/icons.js"></script>
<script>
window.CHAT = {
  name: 'Hasan Usta · Pideci', sub: 'çevrimiçi', avatar: 'assets/pide2.jpg', clockStart: 20 * 60 + 41, end: 24.6,
  msgs: [
    { s: 'L', t: 1.2, text: 'Selamün aleyküm Mehmet abi 👋' },
    { s: 'L', t: 2.6, text: 'Dükkân nasıl, işler ne âlemde?' },
    { s: 'R', t: 4.3, ty: 3.1, text: 'Aleyküm selam Hasan 😊' },
    { s: 'R', t: 6.3, ty: 4.7, text: 'Maşallah bu ara siparişe yetişemiyoruz 😅' },
    { s: 'L', t: 7.7, text: 'Hayırdır abi, sırrın ne? 😄' },
    { s: 'R', t: 9.4, ty: 8.1, text: "getirtrend'e restoranı ekledim 👍" },
    { s: 'R', t: 10.4, img: 'assets/ui/demo-top.jpg', h: 620, cap: 'Müşteri bizi böyle görüyor 👇', zoom: [10.9, 12.9] },
    { s: 'R', t: 15.6, ty: 14.6, text: 'Bak yine sipariş geldi 😄' },
    { s: 'L', t: 17.0, text: 'Abi ben nasıl eklerim? 🙏' },
    { s: 'R', t: 18.8, ty: 17.6, link: true, text: 'Buradan başvur, ücretsiz 👇', typed: 'getirtrend.com/restoran-ol' },
    { s: 'L', t: 20.6, text: 'Hemen ekliyorum abi, Allah razı olsun 🤲' },
    { s: 'R', t: 22.4, ty: 21.2, text: 'Hayırlı işler kardeşim 🤝' },
  ],
  notifs: [{ t: 13.3, d: 1.9, title: '🔔 Yeni sipariş · 360 TL', body: '2× Lahmacun, 1× Ayran · Kapıda nakit' }],
};
</script>
<script src="chat.js"></script>
<script>
  window.DEFAULT_DURS = [CHAT.end, 5.6];
  HOOKS.out = (lt) => { if (lt > 2.4) document.getElementById('cta').style.transform = `scale(${1 + 0.04 * Math.sin((lt - 2.4) * 7)})`; };
</script>
</body>
</html>
