<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>getirtrend – %0 Komisyon (A)</title>
<link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="assets/brand.css"><link rel="stylesheet" href="mg.css"></head>
<body data-music="pop" data-dots="off">
<div id="stage">
  <div class="scene" id="m1" data-static="1" data-dur="3.2" data-sfx="whoosh:0;pop:0.25">
    <div class="bgfx" id="m1fx"></div>
    <div class="hk" id="hook">Sipariş gelirinin<br><em>yarısı</em><br>komisyona mı<br>gidiyor?</div>
  </div>
  <div class="scene" id="m2" data-static="1" data-dur="7.0" data-sfx="whoosh:0;pop:0.7;pop:2.5;pop:4.3">
    <div class="bgfx" id="m2bg" style="background:linear-gradient(160deg,#fff 0%,#FFF1E8 55%,#FFD9C2 100%)"></div>
    <div class="t2" id="m2t" style="color:var(--nv)"><span class="gt" style="font-size:96px"><img src="assets/logo-mark.svg"><span>getir<b style="color:var(--or)">trend</b></span></span><br>ile değişiyor</div>
    <div style="height:40px"></div>
    <div class="ben" id="b1"><span data-ic="percent"></span><div>%0 Komisyon*<small>Aracı payı yok</small></div></div>
    <div class="ben" id="b2"><span data-ic="layout-dashboard"></span><div>Tek Ekranda<br>Kolay Yönetim<small>Sipariş, menü, bölge tek panelde</small></div></div>
    <div class="ben" id="b3"><span data-ic="wallet"></span><div>Kazancın<br>Tamamı Senin<small>Ödemeyi kapıda sen alırsın</small></div></div>
    <div class="foot" style="color:var(--nv)">*İlk etapta komisyon alınmaz.</div>
  </div>
  <div class="scene" id="m3" data-static="1" data-dur="5.0" data-sfx="whoosh:0;success:0.5">
    <div class="bgfx" style="background:radial-gradient(80% 60% at 50% 40%, var(--nv2), var(--nv))"></div>
    <img src="assets/logo-mark.svg" id="lm" style="width:220px;height:220px;border-radius:52px;position:relative">
    <div style="height:40px"></div>
    <div class="brandw" id="bw" style="position:relative">getir<span>trend</span></div>
    <div style="height:90px"></div>
    <div class="cta" id="cta" style="position:relative">Hemen Ücretsiz Katıl →</div>
    <div style="height:50px"></div>
    <div class="url2" id="u" style="position:relative">getirtrend.com/restoran-ol</div>
  </div>
</div>
<script src="engine.js"></script>
<script src="assets/icons.js"></script>
<script>
  const $ = id => document.getElementById(id);
  // damped spring: overshoots then settles at 1
  const spring = k => k <= 0 ? 0 : 1 - Math.exp(-6 * k) * Math.cos(11 * k);
  const eio = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  window.DEFAULT_DURS = [3.2, 7.0, 5.0];
  $('m1fx').innerHTML = [0, 1, 2, 3, 4].map(i => `<div class="shard" style="left:${-200 + i * 280}px;top:${-300 + (i % 2) * 900}px;width:120px;height:2600px"></div>`).join('');
  HOOKS.m1 = (lt) => {
    const k = clamp((lt - 0.15) / 0.55), s = 2.4 - 1.4 * spring(k);
    const shake = lt > 0.15 && lt < 0.55 ? Math.sin(lt * 90) * 18 * (1 - (lt - .15) / .4) : 0;
    $('hook').style.transform = `translateX(${shake}px) scale(${s})`; $('hook').style.opacity = clamp(k * 3);
    document.querySelectorAll('#m1 .shard').forEach((e, i) => e.style.transform = `rotate(28deg) translateY(${(lt * 220 + i * 90) % 400 - 200}px)`);
    const em = document.querySelector('#hook em'); em.style.textShadow = lt > 0.9 ? `0 0 ${20 + 15 * Math.sin(lt * 10)}px rgba(255,107,26,.8)` : 'none';
  };
  HOOKS.m2 = (lt) => {
    const t = clamp(lt / 0.5); $('m2t').style.opacity = eio(t); $('m2t').style.transform = `translateY(${(1 - eio(t)) * -60}px)`;
    [['b1', 0.7], ['b2', 2.5], ['b3', 4.3]].forEach(([id, a]) => {
      const k = clamp((lt - a) / 0.6), el = $(id);
      el.style.opacity = clamp(k * 3); el.style.transform = `translateX(${(1 - spring(k)) * 700}px) rotate(${(1 - spring(k)) * 4}deg)`;
      el.querySelector('.ic').style.transform = `scale(${0.4 + 0.6 * spring(clamp((lt - a - 0.15) / 0.6))})`;
    });
  };
  HOOKS.m3 = (lt) => {
    const k1 = clamp(lt / 0.6); $('lm').style.transform = `scale(${spring(k1)}) rotate(${(1 - spring(k1)) * -20}deg)`;
    const k2 = clamp((lt - 0.25) / 0.6); $('bw').style.opacity = eio(k2); $('bw').style.transform = `translateY(${(1 - eio(k2)) * 60}px)`;
    const k3 = clamp((lt - 0.8) / 0.6), c = $('cta');
    const beat = lt > 1.4 ? (lt - 1.4) % 0.9 / 0.9 : 0;
    c.style.opacity = clamp(k3 * 3);
    c.style.transform = `scale(${spring(k3) * (1 + 0.07 * Math.max(0, Math.sin(beat * Math.PI)))})`;
    c.style.boxShadow = lt > 1.4 ? `0 0 0 ${beat * 46}px rgba(255,107,26,${0.55 * (1 - beat)})` : 'none';
    $('u').style.opacity = eio(clamp((lt - 1.3) / 0.5));
  };
</script>
</body>
</html>
