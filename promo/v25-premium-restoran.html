<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>getirtrend – Premium Restoran</title>
<link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="assets/brand.css"><link rel="stylesheet" href="pro.css"></head>
<body data-music="corporate" data-dots="off">
<div id="stage">
  <div class="scene" id="p" data-static="1" data-dur="17.4"></div>
  <div class="scene" id="end" data-static="1" data-dur="5.0" data-sfx="success:0.4">
    <div class="rule" style="top:880px;left:240px;right:240px" id="er"></div>
    <div id="lock" style="position:absolute;top:620px;left:0;right:0;text-align:center"><span class="gt" style="font-size:150px"><img src="assets/logo-mark.svg"><span>getir<b>trend</b></span></span></div>
    <div id="sub" style="position:absolute;top:930px;left:0;right:0;text-align:center;font:300 60px 'Inter';letter-spacing:-1.5px">Restoranlar için. <b style="font-family:'Plus Jakarta Sans';font-weight:800">Komisyonsuz.*</b></div>
    <div id="pill" style="position:absolute;top:1120px;left:0;right:0;display:flex;justify-content:center"><div class="pillo">getirtrend.com/restoran-ol</div></div>
    <div id="sm" style="position:absolute;top:1290px;left:0;right:0;text-align:center;font:500 34px 'Inter';opacity:.6">Başvuru ücretsiz · Aylık ücret yok</div>
    <div class="fn">*İlk etapta komisyon alınmaz.</div>
  </div>
</div>
<script src="engine.js"></script>
<script>
  const $ = id => document.getElementById(id);
  // [image, background-position, label, light line, bold line]
  const S = [
    ['ai/1.jpg', '50% 55%', '01 — Akşam', 'Dükkân sakin.', 'Ama telefon hazır.'],
    ['ai/2.jpg', '50% 62%', '02 — Sipariş', 'Bir bildirim,', 've mutfak başlar.'],
    ['ai/4.jpg', '50% 50%', '03 — Hazırlık', 'Fırından çıkar,', 'sıcacık yola çıkar.'],
    ['ai/5.jpg', '50% 92%', '04 — Kasa', 'Fiş yazıcıdan,', 'kayıt AlfaPOS’ta.'],
    ['ai/3a.jpg', '40% 50%', '05 — Kazanç', 'Komisyon yok,*', 'kazanç sizde.'],
  ];
  const L = 17.4 / S.length;
  const sc = $('p');
  sc.innerHTML = `<div class="topbar"><span class="gt" style="font-size:44px"><img src="assets/logo-mark.svg"><span>getir<b>trend</b></span></span><span class="idx" id="idx">01 / 05</span></div><div class="rule" id="rl"></div>` +
    S.map((s, i) => `<div class="frame" id="f${i}"><div class="img" style="background-image:url(assets/${s[0]});background-position:${s[1]}"></div></div>
      <div class="label" id="lb${i}">${s[2]}</div><div class="hline" id="h${i}"><span class="lt">${s[3]}</span><span class="bd">${s[4]}</span></div>`).join('') +
    `<div class="fn" id="fnp" style="opacity:0">*İlk etapta komisyon alınmaz.</div>`;
  sc.dataset.sfx = S.map((_, i) => `whoosh:${(i * L + 0.05).toFixed(2)}`).join(';');
  window.DEFAULT_DURS = [17.4, 5.0];
  const eio = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  HOOKS.p = (lt) => {
    $('rl').style.transform = `scaleX(${eio(lt / 0.8)})`;
    const cur = Math.min(S.length - 1, Math.floor(lt / L));
    $('idx').textContent = `0${cur + 1} / 0${S.length}`;
    S.forEach((_, i) => {
      const k = lt - i * L, f = $('f' + i), img = f.firstElementChild;
      const on = k > -0.01 && k < L + 0.6;
      f.style.display = on ? 'block' : 'none'; $('lb' + i).style.display = $('h' + i).style.display = on ? 'block' : 'none';
      if (!on) return;
      // curtain reveal from the bottom, the previous frame stays underneath
      const r = eio(k / 0.7); f.style.clipPath = `inset(${(1 - r) * 100}% 0 0 0 round 30px)`; f.style.zIndex = 1 + i;
      img.style.transform = `scale(${1.16 - 0.12 * clamp(k / L)}) translateY(${(1 - r) * 80}px)`;
      const tIn = eio((k - 0.35) / 0.6), tOut = 1 - eio((k - (L - 0.25)) / 0.3);
      const lb = $('lb' + i), h = $('h' + i);
      lb.style.opacity = Math.min(tIn, tOut); lb.style.transform = `translateY(${(1 - tIn) * 20}px)`;
      [...h.children].forEach((c, j) => { const t = eio((k - 0.45 - j * 0.12) / 0.6);
        c.style.opacity = Math.min(t, tOut); c.style.transform = `translateY(${(1 - t) * 50}px)`; c.style.clipPath = `inset(0 0 ${(1 - t) * 100}% 0)`; });
      h.style.zIndex = lb.style.zIndex = 10;
    });
    $('fnp').style.opacity = 0.55 * eio((lt - 4 * L - 0.6) / 0.5);
  };
  HOOKS.end = (lt) => {
    const a = eio(lt / 0.8); $('lock').style.opacity = a; $('lock').style.transform = `translateY(${(1 - a) * 40}px) scale(${0.96 + 0.04 * a})`;
    $('er').style.transform = `scaleX(${eio((lt - 0.4) / 0.8)})`;
    const b = eio((lt - 0.6) / 0.7); $('sub').style.opacity = b; $('sub').style.transform = `translateY(${(1 - b) * 30}px)`;
    const c = eio((lt - 1.0) / 0.7); $('pill').style.opacity = c; $('pill').style.transform = `translateY(${(1 - c) * 30}px)`;
    $('sm').style.opacity = 0.6 * eio((lt - 1.3) / 0.7);
  };
</script>
</body>
</html>
